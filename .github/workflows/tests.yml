name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mechanics:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install open CJK font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install open CJK font on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP "NotoSansCJKsc-Regular.otf"
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile $font
          "MECHCURVE_FONT=$font" | Out-File -Append $env:GITHUB_ENV
      - run: python -m pip install -e ".[agent,test]"
      - run: python -m pytest -q
      - run: mechcurve analyze examples/demo --lang en --notes examples/demo/notes.json
